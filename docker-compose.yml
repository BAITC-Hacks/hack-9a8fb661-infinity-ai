# docker compose up --build   ->   UI: http://localhost:3000   API: http://localhost:8010/api/docs
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: wind
      CLICKHOUSE_USER: wind
      CLICKHOUSE_PASSWORD: wind
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123"]
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "wind", "--password", "wind", "-q", "SELECT 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { clickhouse: { condition: service_healthy } }
    environment:
      DB_BACKEND: clickhouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: wind
      CLICKHOUSE_PASSWORD: wind
      CLICKHOUSE_DB: wind
      WEATHER_OFFLINE: "true"
      USE_MOCK_LLM: ${USE_MOCK_LLM:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
    ports: ["8010:8000"]

  frontend:
    build: ./frontend
    depends_on: { backend: { condition: service_healthy } }
    ports: ["3000:80"]

volumes:
  clickhouse-data:
