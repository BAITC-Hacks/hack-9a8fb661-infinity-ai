# docker compose up --build   ->   UI: http://localhost:3000   API: http://localhost:8010/api/docs
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: wind
      CLICKHOUSE_USER: wind
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-wind}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]   # 8123 HTTP (DBeaver/curl), 9000 native (clickhouse-client)
    volumes: [clickhouse-data:/var/lib/clickhouse]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user wind --password \"$$CLICKHOUSE_PASSWORD\" -q \"SELECT 1\""]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on: { clickhouse: { condition: service_healthy } }
    environment:
      DB_BACKEND: clickhouse
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: wind
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-wind}
      CLICKHOUSE_DB: wind
      WEATHER_OFFLINE: "true"
      USE_MOCK_LLM: ${USE_MOCK_LLM:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      APP_LOGIN: ${APP_LOGIN:-expert}
      APP_PASSWORD: ${APP_PASSWORD:-infinity-demo}
      APP_SECRET: ${APP_SECRET:-}
      VLLM_MODEL: ${VLLM_MODEL:-qwen}
    extra_hosts: ["host.docker.internal:host-gateway"]   # туннель к vLLM на хосте
    ports: ["8010:8000"]

  frontend:
    build: ./frontend
    depends_on: { backend: { condition: service_healthy } }
    ports: ["3000:80"]

volumes:
  clickhouse-data:
